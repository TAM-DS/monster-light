[project]
name = "monster-light"
version = "0.1.0"
description = "Deterministic portfolio domain for Monster Light"
requires-python = ">=3.13"
dependencies = [
    "openai>=3.14.1",
    "pydantic>=2.13.5",
    "streamlit==1.64.0",
    "yfinance==1.7.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
